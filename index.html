<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="AELIA AI — Light. Intelligence. Yours. A unified AI workspace by Novella Matrix.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="https://aeliaai.org.ng/">
  <title>AELIA AI — Light. Intelligence. Yours.</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span class="aelia-orbit"></span><span class="aelia-core">A</span></span>
        <span>AELIA <b>AI</b></span>
      </div>
      <div class="brand-sub">LIGHT · INTELLIGENCE · YOURS</div>
      <button class="new-chat" data-action="new-chat">＋ New chat</button>
      <nav id="nav">
        <button class="nav-item active" data-view="home">⌂ <span>Today</span></button>
        <button class="nav-item" data-view="chat">◌ <span>Chat & Reason</span></button>
        <button class="nav-item" data-view="agents">✦ <span>AELIA Agents</span></button>
        <button class="nav-item" data-view="research">⌕ <span>Research</span></button>
        <button class="nav-item" data-view="create">✧ <span>Create</span></button>
        <button class="nav-item" data-view="projects">▦ <span>Projects</span></button>
        <button class="nav-item" data-view="files">□ <span>Files & Knowledge</span></button>
        <button class="nav-item" data-view="workflows">↯ <span>Automations</span></button>
        <button class="nav-item" data-view="connectors">◈ <span>Connectors</span></button>
        <button class="nav-item" data-view="channels">◉ <span>Channels</span></button>
        <button class="nav-item" data-view="developers">⌘ <span>Developers</span></button>
        <button class="nav-item" data-view="settings">⚙ <span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="mode-card"><span class="status-dot"></span><div><strong id="mode-title">AELIA foundation</strong><small id="mode-sub">API-ready · connector-ready</small></div></div>
        <button class="theme-link" data-action="toggle-theme">☼ Bright / Night</button>
        <a class="whatsapp-link" href="mailto:hello@aeliaai.org.ng">✉ Contact AELIA by email</a>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" data-action="toggle-sidebar">☰</button>
        <div class="crumb" id="crumb">Today</div>
        <div class="top-actions">
          <span class="api-state" id="api-state"><i></i> Checking AELIA…</span>
          <button class="icon-btn" data-action="command-palette" title="Command palette">⌘K</button>
          <button class="profile" data-view="settings"><span>IA</span><strong>Ibrahim</strong></button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modal-root"></div>
  <script src="./app.js"></script>
</body>
</html>
